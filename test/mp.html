<!DOCTYPE html>
<html lang="ko">
<head><meta charset="utf-8"><title>37 게임 멀티플레이 프로토콜 검증</title></head>
<body>
<pre id="out">running...</pre>

<script src="../js/cards.js"></script>
<script src="../js/game.js"></script>
<script src="../js/ai.js"></script>
<script src="../js/net.js"></script>
<script>
/* 방장 1 + 가상 참가자 봇 2 를 로컬 가짜 서버(LocalHub)로 연결해 게임을 끝까지 돌린다.
 * 봇은 일부러 잘못된 카드를 내고, 응답을 안 하고, 연결을 끊었다 다시 붙는다.
 * 매 화면(view)마다 남의 손패가 새지 않는지 검사한다. */
const errs = [];
window.onerror = (m,s,l,c) => errs.push(`onerror: ${m} @${l}:${c}`);
window.addEventListener('unhandledrejection', e => errs.push('unhandled: ' + (e.reason && e.reason.stack || e.reason)));

const UI = {
  render(){ if (G.mp) G.mp.scheduleSync(); }, onLog(){}, onEvent(){}, gameOver(){},
  humanTurn(p){ return AI.takeTurn(p); }            // 방장 자리는 AI 가 대신 둔다
};
G.io = { ask(spec){ return AI.answer(G.players[G.localIdx], spec); } };

Net.CFG.turnMs = 500; Net.CFG.askMs = 300; Net.CFG.syncMs = 5;

const T = { games:0, finished:0, privacy:[], notices:0, answers:0, badAnswers:0, silentAsks:0,
            silentTurns:0, plays:0, views:0, disconnects:0, reconnects:0, logs:{}, lateJoin:null, overfull:null };
const count = (k) => T.logs[k] = (T.logs[k] || 0) + 1;
const sleepMs = ms => new Promise(r => setTimeout(r, ms));
const arr = Net.arr;

/* ---------- 가상 참가자 ---------- */
function makeBot(hub, uid, name, opts){
  const store = Net.LocalStore(hub, uid);
  const guest = Net.Guest(store);
  const B = { uid, name, store, guest, seat:-1, lastView:null, sent:0, acted:-1, turnActs:0, turnKey:'',
              silentTurn:false, noticeSeen:0, askSeen:0, over:false };

  guest.onView = v => {
    T.views++;
    B.lastView = v; B.seat = v.you;
    checkPrivacy(v, name);
    if (v.notice && v.notice.id !== B.noticeSeen){ B.noticeSeen = v.notice.id; T.notices++; }
    if (v.over){ B.over = true; return; }

    // 선택 요청에 응답
    if (v.ask && v.ask.id !== B.askSeen){
      B.askSeen = v.ask.id;
      const r = Math.random();
      if (r < opts.silentAsk){ T.silentAsks++; return; }                       // 무응답 → 시간 초과
      if (r < opts.silentAsk + opts.badAnswer){ T.badAnswers++; guest.answer(v.ask.id, 'garbage'); return; }
      T.answers++;
      guest.answer(v.ask.id, validAnswer(v, v.ask.spec));
      return;
    }
    if (v.ask) return;

    // 내 턴이면 행동
    const key = v.round + ':' + v.current;
    if (v.current !== v.you) return;
    if (B.turnKey !== key){ B.turnKey = key; B.turnActs = 0; B.silentTurn = Math.random() < opts.silentTurn; if (B.silentTurn) T.silentTurns++; }
    if (B.silentTurn) return;
    if (B.sent > v.ack) return;                          // 앞선 입력 처리 대기
    if (B.acted === v.seq) return;
    B.acted = v.seq;

    const me = arr(v.players)[v.you];
    const hand = arr(me.hand);
    if (B.turnActs < 4 && hand.length && Math.random() < 0.8){
      B.turnActs++;
      const pick = Math.random() < 0.15 ? 'no-such-card' : hand[(Math.random() * hand.length) | 0];
      B.sent = guest.play(pick); T.plays++;
    } else {
      B.sent = guest.endTurn();
    }
  };
  return B;
}

function validAnswer(v, spec){
  const list = arr(spec.list);
  switch (spec.kind){
    case 'confirm': return true;
    case 'options': { const o = list.find(o => !o.disabled); return o ? o.value : null; }
    case 'players': return list.slice(0, spec.count);
    case 'cards':   return list.slice(0, spec.count);
  }
  return null;
}

/* ---------- 비공개 정보 누출 검사 ---------- */
function checkPrivacy(v, who){
  arr(v.players).forEach(p => {
    if (p.idx === v.you) return;
    const st = p.st || {};
    if (!st.reveal && arr(p.hand).length)
      T.privacy.push(`${who}: ${p.name}의 공개되지 않은 손패를 받음 (${arr(p.hand).join(',')})`);
    if (arr(st.mustUse).some(x => x !== '?'))
      T.privacy.push(`${who}: ${p.name}의 강제 사용 카드 id 가 보임`);
  });
  const hand = arr(arr(v.players)[v.you].hand);
  if (hand.length !== arr(v.players)[v.you].handCount) T.privacy.push(`${who}: 내 손패 수 불일치`);
}

/* ---------- 카드 총량 불변식 (방장 엔진) ---------- */
function cardInvariant(){
  const ids = [];
  G.deck.forEach(c => ids.push(c.id)); G.discard.forEach(c => ids.push(c.id));
  G.exiled.forEach(c => ids.push(c.id)); G.players.forEach(p => p.hand.forEach(c => ids.push(c.id)));
  return ids.length === 37 && new Set(ids).size === 37;
}

async function waitFor(cond, ms){
  const end = Date.now() + ms;
  while (!cond()){ if (Date.now() > end) return false; await sleepMs(5); }
  return true;
}

async function runGame(n, withDisconnect){
  setSeed(5000 + n * 7919);
  G.speed = 0;
  const hub = Net.LocalHub();
  const host = Net.Host(Net.LocalStore(hub, 'HOST' + n));
  const code = await host.open('방장', n % 2 ? 4 : 3);

  const bots = [
    makeBot(hub, 'A' + n, '친구1', { silentAsk:0.10, badAnswer:0.10, silentTurn:0.08 }),
    makeBot(hub, 'B' + n, '친구2', { silentAsk:0.05, badAnswer:0.05, silentTurn:0.05 })
  ];
  for (const b of bots) await b.guest.join(code, b.name);
  await waitFor(() => host.seats.length === 3, 2000);

  // 3인 방에 4번째가 들어오면 자리를 받으면 안 된다
  if (n === 0){
    const extra = makeBot(hub, 'X' + n, '넘침', { silentAsk:0, badAnswer:0, silentTurn:0 });
    await extra.guest.join(code, '넘침');
    await sleepMs(50);
    T.overfull = host.seats.some(s => s.uid === 'X' + n) ? '실패: 자리를 받음' : '정상: 자리 없음';
  }

  T.games++;
  const gameP = host.start();

  // 시작 후 들어온 사람도 자리를 받으면 안 된다
  if (n === 1){
    const late = makeBot(hub, 'L' + n, '지각', { silentAsk:0, badAnswer:0, silentTurn:0 });
    await late.guest.join(code, '지각');
    await sleepMs(50);
    T.lateJoin = G.players.some(p => p.uid === 'L' + n) ? '실패: 자리를 받음' : '정상: 자리 없음';
  }

  // 한 봇은 게임 도중 연결이 끊겼다가 돌아온다.
  // n=2 에서는 탭을 닫은 것처럼 영영 안 돌아오고, 새 ID 로 같은 닉네임을 써서 다시 들어온다.
  if (withDisconnect){
    (async () => {
      await waitFor(() => G.round >= 2 || G.over, 20000);
      if (G.over) return;
      bots[1].store.simulateDisconnect(); bots[1].offline = true; T.disconnects++;
      await waitFor(() => G.round >= 4 || G.over, 20000);
      if (G.over) return;
      if (n === 6) return;             // 끝날 때까지 끊긴 채로 둔다 → 종료 후 재접속해 결과를 받아야 함
      if (n !== 2){ bots[1].store.simulateReconnect(); bots[1].offline = false; T.reconnects++; return; }
      const seatBefore = G.players.findIndex(p => p.name === '친구2');
      const nb = makeBot(hub, 'N' + n, '친구2', { silentAsk:0, badAnswer:0, silentTurn:0 });
      await nb.guest.join(code, '친구2');
      const ok = await waitFor(() => nb.lastView && nb.lastView.you === seatBefore, 5000);
      T.rejoin = ok && G.players[seatBefore].uid === 'N' + n
        ? `정상: 새 연결이 자리 ${seatBefore} 를 되찾음` : '실패: 자리를 되찾지 못함';
      bots[1] = nb;                    // 끊긴 채 남은 옛 창 대신 새 창이 게임 종료를 받아야 한다
    })();
  }

  await gameP;
  await sleepMs(30);
  // 끊긴 채로 게임이 끝난 참가자는 다시 접속하면 결과 화면을 받아야 한다
  for (const b of bots) if (b.offline){ b.store.simulateReconnect(); b.offline = false; T.lateResult = (T.lateResult || 0) + 1; }
  await waitFor(() => bots.every(b => b.over), 1000);
  if (G.over) T.finished++;
  G.log.forEach(e => {
    if (e.msg.includes('연결 끊김')) count('연결 끊김 → AI 대행');
    if (e.msg.includes('다시 연결됨')) count('재접속 → 복귀');
    if (e.msg.includes('시간 초과 — 턴 종료')) count('턴 시간 초과');
    if (e.msg.includes('응답 시간 초과')) count('선택 시간 초과 → 자동 선택');
    if (e.msg.includes('잘못된 응답')) count('잘못된 응답 → 자동 선택');
  });
  if (!cardInvariant()) T.privacy.push(`게임${n}: 카드 총량 불변식 위반`);
  const botsDone = bots.every(b => b.over || (b.lastView && arr(b.lastView.players)[b.seat] && !arr(b.lastView.players)[b.seat].alive));
  if (!botsDone) T.privacy.push(`게임${n}: 참가자 화면에 게임 종료가 전달되지 않음`);
  host.close();
}

/* ---------- 로그 비공개 단위 검사 ---------- */
function logPrivacyUnit(){
  const out = [];
  G.players = [makePlayer(0,'P0',false), makePlayer(1,'P1',false), makePlayer(2,'P2',false)];
  G.players[1].remote = true; G.players[1].uid = 'u1';
  G.players[2].remote = true; G.players[2].uid = 'u2';
  G.deck = []; G.discard = []; G.exiled = []; G.carried = []; G.log = []; G.current = null;
  L('공개 문구', 'x');
  L('「비밀카드」 손패로', 'x', { to:1, alt:'1장 손패로' });
  const h = Net.Host(Net.LocalStore(Net.LocalHub(), 'h'));
  const v1 = JSON.stringify(h.viewFor(G.players[1]).log);
  const v2 = JSON.stringify(h.viewFor(G.players[2]).log);
  out.push(v1.includes('비밀카드') ? '✔ 당사자는 원문을 봄' : '✘ 당사자가 원문을 못 봄');
  out.push(!v2.includes('비밀카드') && v2.includes('1장 손패로') ? '✔ 다른 사람은 대체 문구만 봄' : '✘ 다른 사람에게 원문 노출');
  return out;
}

/* ---------- 방장이 선택 창에 응답하지 않을 때 ---------- */
async function hostAskTimeoutUnit(){
  const h = Net.Host(Net.LocalStore(Net.LocalHub(), 'h2'));
  G.players = [makePlayer(0,'방장',false), makePlayer(1,'봇',true)];
  G.localIdx = 0; G.log = [];
  const saved = G.io.ask;
  G.io.ask = () => new Promise(() => {});           // 방장이 자리를 비움 — 창이 영영 안 닫힘
  G.mp = h;
  const v = await ask(G.players[0], { kind:'options', prompt:'「혼란」 지정됨',
    list:[{ value:'offense', label:'공격' }, { value:'disturb', label:'교란' }] });
  G.mp = null; G.io.ask = saved;
  const ok = (v === 'offense' || v === 'disturb') && G.log.some(e => e.msg.includes('응답 시간 초과'));
  return ok ? '✔ 방장이 응답하지 않으면 제한 시간 뒤 자동 선택 (게임이 멈추지 않음)' : '✘ 방장 선택 창에서 게임이 멈춤';
}

(async () => {
  const t0 = performance.now();
  const unit = logPrivacyUnit();
  unit.push(await hostAskTimeoutUnit());
  try {
    for (let n = 0; n < 8; n++) await runGame(n, n % 2 === 0);
  } catch (e){ errs.push('throw: ' + (e && e.stack || e)); }

  document.getElementById('out').textContent =
`=== 멀티플레이 프로토콜 검증 ===
게임           : ${T.games} (완주 ${T.finished})
소요           : ${((performance.now() - t0) / 1000).toFixed(1)}s
참가자 화면 수신: ${T.views}
참가자 카드 사용 시도: ${T.plays}  (거절 알림 ${T.notices})
선택 응답      : 정상 ${T.answers} / 잘못된 답 ${T.badAnswers} / 무응답 ${T.silentAsks}
일부러 턴 방치 : ${T.silentTurns}
연결 끊김/복구 : ${T.disconnects} / ${T.reconnects}
3인 방 4번째 입장: ${T.overfull}
시작 후 입장   : ${T.lateJoin}
같은 닉네임 재입장: ${T.rejoin || '(해당 게임에서 발생 안 함)'}
끊긴 채 종료 → 재접속 후 결과 수신: ${T.lateResult ? T.lateResult + "건 (아래 종료 전달 검사에 포함)" : "(발생 안 함)"}

방장이 처리한 상황 (로그 기준):
${Object.entries(T.logs).map(([k, v]) => '  ' + k.padEnd(22) + v).join('\n') || '  (없음)'}

로그 비공개 단위 검사:
${unit.map(s => '  ' + s).join('\n')}

거절된 응답 상세 (${Net.debug.length}):
${Net.debug.map(d => '  ' + JSON.stringify(d)).join('\n') || '  없음'}

--- 비공개 정보 누출·불변식 위반 (${T.privacy.length}) ---
${T.privacy.slice(0, 20).join('\n') || '없음'}

--- 오류 (${errs.length}) ---
${errs.slice(0, 10).join('\n') || '없음'}
=== DONE ===`;
})();
</script>
</body>
</html>
